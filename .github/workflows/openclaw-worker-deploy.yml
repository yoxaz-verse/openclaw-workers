name: OpenClaw Worker Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'openclaw-worker/**'
      - '.github/workflows/openclaw-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: openclaw-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_REPO="ghcr.io/${OWNER_LC}/${IMAGE_NAME}"
          IMAGE_TAG_SHA="${IMAGE_REPO}:sha-${SHORT_SHA}"
          IMAGE_TAG_LATEST="${IMAGE_REPO}:latest"
          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=${IMAGE_TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag_latest=${IMAGE_TAG_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./openclaw-worker
          file: ./openclaw-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image_tag_sha }}
            ${{ steps.vars.outputs.image_tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to CapRover
        run: |
          docker run --rm caprover/cli-caprover:v2.1.1 caprover deploy \
            --caproverUrl "${{ secrets.CAPROVER_SERVER }}" \
            --appToken "${{ secrets.CAPROVER_APP_TOKEN }}" \
            --appName "${{ secrets.CAPROVER_APP_NAME }}" \
            --imageName "${{ steps.vars.outputs.image_tag_sha }}"
